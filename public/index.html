<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六 AI 圆桌辩论 · 多模型自动讨论</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-dot"></span>
        <div>
          <h1>六 AI 圆桌辩论</h1>
          <p class="subtitle">ChatGPT · Claude · Codex · DeepSeek · Gemini · 豆包 自动讨论、互相反驳、形成结论</p>
        </div>
      </div>
      <button id="btnSettings" class="btn ghost" type="button">接入配置</button>
    </div>
  </header>

  <main class="container">
    <section class="panel composer">
      <label class="label" for="topic">讨论议题</label>
      <textarea id="topic" rows="3" placeholder="例如：专科生应该先就业还是先升本？"></textarea>

      <div class="composer-row">
        <div class="field">
          <label class="label" for="rounds">辩论轮数：<span id="roundsValue">2</span></label>
          <input type="range" id="rounds" min="1" max="5" step="1" value="2" />
        </div>
        <div class="actions">
          <button id="btnStart" class="btn primary" type="button">开始讨论</button>
          <button id="btnStop" class="btn danger hidden" type="button">停止</button>
          <button id="btnClear" class="btn ghost" type="button">清空记录</button>
        </div>
      </div>
      <p class="hint">密钥只保存在本机浏览器（localStorage），不会上传到仓库；也可在服务端 `.env` 中配置。</p>
    </section>

    <section class="panel participants" id="participantsPanel">
      <h2>参与 AI</h2>
      <div id="participantList" class="participant-grid"></div>
    </section>

    <section class="panel board">
      <h2>讨论记录</h2>
      <div id="messageList" class="messages empty">
        <p class="empty-text">输入议题并点击「开始讨论」，六位 AI 将依次发言、互相反驳。</p>
      </div>
    </section>

    <section class="panel conclusion hidden" id="conclusionPanel">
      <h2>最终结论</h2>
      <div id="consensus" class="consensus"></div>
      <div id="conclusionList" class="conclusion-list"></div>
    </section>
  </main>

  <!-- 设置抽屉 -->
  <div id="drawerMask" class="mask hidden"></div>
  <aside id="drawer" class="drawer hidden">
    <div class="drawer-head">
      <h2>六家接入配置</h2>
      <button id="btnCloseDrawer" class="btn ghost" type="button">关闭</button>
    </div>
    <div id="drawerBody" class="drawer-body"></div>
    <div class="drawer-foot">
      <p class="hint">未填写的 AI 不会参与讨论；模型名与 Base URL 可保持默认，有需要再改。</p>
    </div>
  </aside>

  <script src="app.js"></script>
</body>
</html>
